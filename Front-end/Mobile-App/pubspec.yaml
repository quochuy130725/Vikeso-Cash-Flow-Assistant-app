name: finauto_mobile
description: "Ứng dụng quản lý thu chi tiện lợi dành cho chủ cửa hàng"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  camera: ^0.12.0+1
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter

  flutter_dotenv: ^6.0.1
  flutter_secure_storage: ^10.3.1
  google_fonts: ^6.1.0
  http: ^1.2.1
  image_picker: ^1.2.2
  intl: ^0.19.0
  excel: ^4.0.6
  path_provider: ^2.1.3
  share_plus: ^10.1.4
  socket_io_client: ^3.0.0
  url_launcher: ^6.2.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - .env

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0


